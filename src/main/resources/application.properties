# Server Configuration
server.port=8080

# Application Configuration
spring.application.name=insurance_ai

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3310/insurance_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.hibernate=DEBUG
logging.level.org.insurance.ai=DEBUG

# Console logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File logging (optional - uncomment to enable)
# logging.file.name=logs/insurance-ai.log
# logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Specific package logging levels
logging.level.org.insurance.ai.controller=INFO
logging.level.org.insurance.ai.service=DEBUG
logging.level.org.insurance.ai.repository=DEBUG

# Spring Framework specific logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.context=DEBUG
logging.level.org.springframework.beans=DEBUG
logging.level.org.springframework.transaction=DEBUG

# Tomcat and embedded server logging
logging.level.org.apache.tomcat=INFO
logging.level.org.apache.catalina=INFO

# JPA/Hibernate detailed logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type=TRACE

# Error page configuration
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# LLM Configuration
llm.provider=openrouter

# OpenRouter Configuration
openrouter.model=meta-llama/llama-3.1-8b-instruct
openrouter.max-tokens=1000
openrouter.temperature=0.3
openrouter.site-url=https://localhost:8080
openrouter.app-name=Insurance AI
